name: Worker JS Tests

on:
  push:
    paths:
      - "worker_六账户骨架版.js"
      - "tests/**"
      - ".github/workflows/worker-test.yml"
  pull_request:
    paths:
      - "worker_六账户骨架版.js"
      - "tests/**"
      - ".github/workflows/worker-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Worker simulation tests
        run: node tests/worker.test.mjs
